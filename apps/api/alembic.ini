# Alembic configuration.
#
# The database URL is intentionally absent. It is injected from
# POSTGRES_DSN at runtime by alembic/env.py, so credentials live in exactly one
# place (.env) and cannot drift between this file and the application.
#
# `script_location` is set by alembic/env.py's file:// argument, which is why
# this file is mostly about logging and the migration policy hook.

[alembic]
# `%(here)s` resolves relative to this file, not the CWD. Alembic supports it
# natively, so one command works from the repository root, from apps/api, and
# from inside a container -- and there is no separate Makefile target that has to
# remember to pass an absolute path.
script_location = %(here)s/alembic
# sys.path is bootstrapped in env.py from __file__ rather than here, because
# `prepend_sys_path` resolves against the current working directory and this
# command is run from three different places.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
