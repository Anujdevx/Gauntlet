[project]
name = "oa-api"
version = "0.1.0"
description = "FastAPI control plane. Never executes user code; only enqueues and streams."
requires-python = ">=3.11,<3.12"
dependencies = [
    "oa-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    # Redis client for execution event streams and session storage. The API
    # must NOT depend on celery: the absence is what guarantees this image
    # cannot import a worker app and reach a container runtime.
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pgvector>=0.3.6",
    "email-validator>=2.2",
    "kombu>=5.4",
    "celery>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_api"]
