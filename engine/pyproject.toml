[project]
name = "oa-engine"
version = "0.1.0"
description = "Skill modelling: BKT, Elo, DAG blame, adaptive retrieval, LLM mutation validation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_engine"]